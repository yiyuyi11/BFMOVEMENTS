[[mods]]
modId = "battlefield_movement"
version = "1.7.14"
displayName = "战地机动 · Battlefield Movement"
authors = "Battlefield Movement"
description = '''滑铲 / 飞扑 / 战术趴地，趴地动作直接移植 Tacz Animation Additions 1.2.12。
趴地使用原 mod 的 37 个角度姿态与进入/退出关键帧：趴着转动视角会像战地 5 一样侧翻、仰躺。
独立键位：Z 趴下/起身（冲刺时飞扑），左 Alt 直接滑铲；冲刺时按潜行键也可滑铲。
1.3.0：镜头单目标平滑、趴地骨骼抬升、飞扑第三人称改用专用姿态、TaCZ/卓越前线手臂兼容。'''

